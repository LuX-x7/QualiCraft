[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qualicraft"
version = "0.1.0"
description = "A local-first, researcher-led qualitative coding workspace"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "QualiCraft contributors"}]
dependencies = []

[project.scripts]
qualicraft = "qualicraft.server:main"

[tool.setuptools.packages.find]
where = ["."]
